# Place this file manually into .github/workflows/android-release.yml
# طبق درخواست شما، ورکفلو در پوشه جداگانه قرار داده شده تا خودتان به پوشه اصلی منتقل کنید
# Copy to: .github/workflows/android-release.yml

name: Android Release Build

on:
  push:
    branches: [ "main", "arena/*" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate public keystore if not exists
        run: |
          KEYSTORE_PATH="app/keystore/tradescanner.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating keystore at $KEYSTORE_PATH"
            mkdir -p app/keystore
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias tradescanner \
              -storepass tradescanner \
              -keypass tradescanner \
              -dname "CN=TradeScanner Public, OU=Dev, O=TradeScanner, L=Tehran, ST=Tehran, C=IR"
            echo "Keystore generated"
          else
            echo "Keystore exists, skipping generation"
          fi

          # Ensure keystore.properties exists for build
          cat > app/keystore/keystore.properties <<EOF
          storeFile=keystore/tradescanner.jks
          storePassword=tradescanner
          keyAlias=tradescanner
          keyPassword=tradescanner
          EOF

      - name: Setup Gradle (fallback if wrapper jar missing)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Generate Wrapper Jar if missing
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Regenerating Gradle Wrapper Jar"
            gradle wrapper --gradle-version 8.6
          fi
          ls -lh gradle/wrapper/

      - name: Build Release APK
        run: |
          ./gradlew clean assembleRelease --stacktrace

      - name: List APKs
        run: |
          find app/build/outputs -name "*.apk" -type f | xargs ls -lh

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tradescanner-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: Also upload to GitHub Release on manual dispatch
      - name: Create Manual Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: manual-build-${{ github.run_number }}
          name: Manual Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
